<!-- assets/templates/admin/redirect_to_return.html -->
{% extends "admin/base.html" %}
{% load i18n %}

{% block content %}
    <h1>{% trans "Opening Return Form" %}</h1>
    <p>{% trans "Click the link below to open the return form in a new tab." %}</p>
    <p><a href="{{ return_url }}" target="_blank" id="open-return-form">{% trans "Open Return Form in New Tab" %}</a></p>
    <p><a href="{% url 'admin:assets_assetassignment_changelist' %}">{% trans "Return to Asset Assignments" %}</a></p>

    <script>
        document.getElementById('open-return-form').addEventListener('click', function() {
            setTimeout(function() {
                window.location.href = "{{ admin_changelist_url|escapejs }}";
            }, 500);
        });
    </script>
{% endblock %}
