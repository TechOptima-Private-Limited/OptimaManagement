{% include "django/forms/widgets/input.html" %}
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Add a specific marker to this date field so it's easier to identify
    var elem = document.getElementById('{{ widget.attrs.id }}');
    if (elem) {
      elem.setAttribute('data-custom-datepicker', 'true');
    }
  });
</script>
