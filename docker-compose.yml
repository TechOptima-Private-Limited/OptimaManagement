services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=hrm_db
      - POSTGRES_USER=hrm_user
      - POSTGRES_PASSWORD=hrm_pass
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    networks:
      - app-network

  backend:
    build:
      context: ./hrms-backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8080
    volumes:
      - ./hrms-backend/hrm_keka:/app/hrm_keka
      - static_volume:/app/hrm_keka/staticfiles
      - media_volume:/app/hrm_keka/media
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=hrm_db
      - DB_USER=hrm_user
      - DB_PASSWORD=hrm_pass
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=True
      - SECRET_KEY=django-insecure-docker-dev-key-change-me
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - IT_SUPPORT_EMAIL=support@yourdomain.com
      - TEAM_EMAILS=team@yourdomain.com
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    networks:
      - app-network

  celery-worker:
    build:
      context: ./hrms-backend
      dockerfile: Dockerfile
    command: celery -A hrm_keka worker --loglevel=info
    volumes:
      - ./hrms-backend/hrm_keka:/app/hrm_keka
      - media_volume:/app/hrm_keka/media
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=hrm_db
      - DB_USER=hrm_user
      - DB_PASSWORD=hrm_pass
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - backend
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:8080/api
    ports:
      - "3002:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
  media_volume:
