services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-hrm_db}
      - POSTGRES_USER=${DB_USER:-hrm_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-hrm_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hrm_user} -d ${DB_NAME:-hrm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./hrms-backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8080
    volumes:
      - ./hrms-backend/hrm_keka:/app/hrm_keka
      - static_volume:/app/hrm_keka/staticfiles
      - media_volume:/app/hrm_keka/media
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-hrm_db}
      - DB_USER=${DB_USER:-hrm_user}
      - DB_PASSWORD=${DB_PASSWORD:-hrm_pass}
      - DB_HOST=db
      - DB_PORT=5432
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key}
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8080/api}
    ports:
      - "3002:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
  media_volume:
